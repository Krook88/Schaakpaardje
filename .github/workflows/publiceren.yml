name: Publiceren naar TransIP (handmatig, nu buiten gebruik)

# LET OP: deze koppeling is er bewust uitgehaald. Schaakmaatje wordt met SFTP
# geüpload, met de zip uit site-bouwen.yml.
#
# Daarom draait deze workflow niet meer vanzelf bij een push naar main. Dat was
# gevaarlijk geworden: hij slaat het publiceren stilletjes over als het geheim
# TRANSIP_SSH_KEY ontbreekt, meldt dan "de gebouwde site staat klaar in de tak
# productie", en eindigt groen. Wie dat zag kon denken dat de site bij was, terwijl
# er niets veranderd was. Een groene vink die niets betekent is erger dan geen vink.
#
# Hij staat er nog omdat het recept klopt: wil je de koppeling ooit terug, zet dan
# TRANSIP_SSH_KEY als GitHub-geheim en start hem met de hand. Zonder dat geheim valt
# hij nu om in plaats van te doen alsof.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publiceren
  cancel-in-progress: true

env:
  TRANSIP_HOST: schabr.ssh.transip.me
  TRANSIP_REPO: schaakmaatjenl@schabr.ssh.transip.me:auto.git

jobs:
  bouwen-en-publiceren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Controles
        run: |
          npm run typecheck
          npm test
          npm run validate:content

      - name: Bouwen
        run: npm run build

      - name: Er een git-repository van maken
        run: |
          cd out
          git init -q -b productie
          git config user.name "Schaakmaatje bouwrobot"
          git config user.email "noreply@schaakmaatje.nl"
          git add -A
          git commit -q -m "Build van ${GITHUB_SHA::7}"

      - name: Bewaren op GitHub (tak productie)
        run: |
          cd out
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            productie

      - name: Publiceren naar TransIP
        env:
          SSH_KEY: ${{ secrets.TRANSIP_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "Geen TRANSIP_SSH_KEY ingesteld, dus er is niets gepubliceerd."
            echo "De koppeling met TransIP is er bewust uitgehaald: uploaden gaat"
            echo "met SFTP, met de zip uit site-bouwen.yml. Wil je deze weg terug,"
            echo "zet dan eerst het geheim TRANSIP_SSH_KEY."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$TRANSIP_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cd out
          git push --force "$TRANSIP_REPO" productie
          echo "Gepubliceerd naar schaakmaatje.nl"
