name: Publiceren naar schaakmaatje.nl

# Bouwt de site en zet hem met SFTP op TransIP. Alleen met de hand te starten, in het
# tabblad Actions, of door Claude na een geslaagde controle.
#
# Drie regels die hier niet mogen veranderen:
#
# 1. Er wordt nooit iets verwijderd op de server. De opnames van Pip (audio/) en de
#    bordgeluiden (sfx/) staan niet in git, alleen op de server, en zijn met credits
#    betaald. De vorige versie pushte met --force naar TransIP AutoGit, en of die de
#    hele map vervangt was nooit nagegaan. Dus: alleen toevoegen en vervangen, en
#    audio/ en sfx/ worden helemaal overgeslagen.
# 2. Standaard is het een proefrun: hij maakt verbinding en laat zien wat hij zou
#    uploaden, zonder iets te veranderen. Pas met "proef" uit gaat er iets online.
# 3. Zonder het geheim TRANSIP_SSH_KEY valt hij om. Een groene vink die niets heeft
#    gepubliceerd is erger dan een rode.
#
# Inspreken: met ELEVENLABS_API_KEY als geheim spreekt hij eerst de zinnen in die nog
# geen opname op de server hebben (tts-render --vanaf leest het manifest van de site),
# tot hoogstens "budget" tekens. Daarna gaan alleen die nieuwe mp3's en het
# bijgewerkte manifest naar audio/, ook hier zonder iets te verwijderen. Het manifest
# dat het script schrijft bevat de oude opnames én de nieuwe; lukt het ophalen van het
# manifest van de site niet, dan stopt het script, zodat er nooit een half manifest
# online komt.
#
# De openbare helft van de sleutel staat bij TransIP, de privé-helft als geheim hier.
# Intrekken: verwijder de openbare helft bij TransIP.

on:
  workflow_dispatch:
    inputs:
      proef:
        description: 'Proefrun: alleen laten zien wat er geüpload en ingesproken zou worden'
        type: boolean
        default: true
      inspreken:
        description: 'Nieuwe zinnen van Pip inspreken (alleen wat nog niet op de server staat)'
        type: boolean
        default: true
      budget:
        description: 'Hoogstens zoveel tekens inspreken (1 teken is ongeveer 1 credit)'
        type: string
        default: '3000'

permissions:
  contents: read

concurrency:
  group: publiceren
  cancel-in-progress: false

env:
  # Geen geheimen: dit staat ook in elk SFTP-programma. Nagaan bij TransIP.
  SFTP_HOST: schabr.ssh.transip.me
  SFTP_USER: schaakmaatjenl
  # De map op de server waar index.html van schaakmaatje.nl staat.
  SFTP_MAP: www

jobs:
  publiceren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Controles en bouwen
        run: npm run check

      - name: Sleutel klaarzetten
        env:
          SSH_KEY: ${{ secrets.TRANSIP_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "Geen TRANSIP_SSH_KEY ingesteld, dus er is niets gepubliceerd."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sudo apt-get install -y -qq lftp > /dev/null

      - name: Inspreken (of tellen)
        if: ${{ inputs.inspreken }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PROEF: ${{ inputs.proef }}
          BUDGET: ${{ inputs.budget }}
        run: |
          if [ "$PROEF" = "true" ]; then
            npx tsx scripts/tts-render.ts --vanaf https://schaakmaatje.nl --budget "$BUDGET" --dry
          else
            if [ -z "$ELEVENLABS_API_KEY" ]; then
              echo "Geen ELEVENLABS_API_KEY ingesteld. Zet hem als geheim, of start met inspreken uit."
              exit 1
            fi
            npx tsx scripts/tts-render.ts --vanaf https://schaakmaatje.nl --budget "$BUDGET"
          fi

      - name: Opnames uploaden
        if: ${{ inputs.inspreken && !inputs.proef }}
        run: |
          # Alleen wat het inspreken net heeft gemaakt: nieuwe mp3's en het manifest.
          # Geen --delete, dus de bestaande opnames blijven staan.
          lftp -u "$SFTP_USER," \
            -e "set sftp:connect-program 'ssh -a -x -i ~/.ssh/id_ed25519'; set net:max-retries 2; mirror --reverse --verbose --exclude-glob .gitkeep public/audio/ $SFTP_MAP/audio/; bye" \
            "sftp://$SFTP_HOST"

      - name: Uploaden (of proef)
        env:
          PROEF: ${{ inputs.proef }}
        run: |
          # mirror -R: van hier naar de server. Geen --delete: er gaat nooit iets weg.
          # --exclude: audio/ en sfx/ blijven op de server precies zoals ze zijn.
          OPTIES="--reverse --verbose --parallel=4 --exclude-glob audio/ --exclude-glob sfx/ --exclude ^audio/ --exclude ^sfx/"
          if [ "$PROEF" = "true" ]; then
            OPTIES="$OPTIES --dry-run"
            echo "PROEFRUN: er wordt niets veranderd."
          fi
          lftp -u "$SFTP_USER," \
            -e "set sftp:connect-program 'ssh -a -x -i ~/.ssh/id_ed25519'; set net:max-retries 2; mirror $OPTIES out/ $SFTP_MAP/; bye" \
            "sftp://$SFTP_HOST"
          if [ "$PROEF" = "true" ]; then
            echo "Proef geslaagd. Start opnieuw met proef uit om echt te publiceren."
          else
            echo "Gepubliceerd naar schaakmaatje.nl."
          fi
